<!DOCTYPE html>
<html>

<head>

    <title>Nova AI</title>

    <!-- Makes the website mobile friendly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">

<div class="overlay" onclick="toggleSidebar()"></div>
    <!-- Sidebar -->

    <div class="sidebar">


        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>


        <div id="chat-list"></div>



        <div class="profile">

            <div class="profile-icon">
                
            </div>


            <div>

                <strong>Nova AI</strong>

                <p>Personal Assistant</p>

            </div>


        </div>


    </div>





    <!-- Main Area -->


    <div class="chat-area">


    <div class="header">

        <button class="menu-button" onclick="toggleSidebar()">
            ☰
        </button>

        <span>
            Nova AI
        </span>

    </div>




        <div id="chat-box">


            <div class="welcome">


                <div class="nova-logo">
                    
                </div>


                <h1>
                    Hi, I'm Nova
                </h1>


                <p>
                    Your personal AI chatbot assistant
                </p>



                <div class="suggestions">


                    <button onclick="suggest('Help me with homework')">
                        📚 Homework
                    </button>


                    <button onclick="suggest('Help me code')">
                        💻 Coding
                    </button>


                    <button onclick="suggest('Give me ideas')">
                        💡 Ideas
                    </button>


                    <button onclick="suggest('Ask me a question')">
                        ❓ Questions
                    </button>


                </div>


            </div>


        </div>






        <div class="input-area">


            <input 
                id="user-input"
                placeholder="Message Nova..."
            >


            <button class="send-button" onclick="sendMessage()">

                ➤

            </button>


        </div>



    </div>


</div>




<script src="script.js"></script>


</body>

</html>
