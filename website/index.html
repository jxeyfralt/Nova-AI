<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nova AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <!-- Dark overlay (phones only) -->
    <div
        class="overlay"
        onclick="toggleSidebar()"
    ></div>


    <!-- ==========================
         SIDEBAR
    =========================== -->

    <aside class="sidebar">

        <button
            class="new-chat"
            onclick="newChat()"
        >
            + New Chat
        </button>

        <div id="chat-list"></div>

        <div class="profile">

            <div class="profile-icon">
                🤖
            </div>

            <div>

                <strong>Nova AI</strong>

                <p>Personal Assistant</p>

            </div>

        </div>

    </aside>



    <!-- ==========================
         CHAT AREA
    =========================== -->

    <main class="chat-area">


        <!-- Header -->

        <header class="header">

            <button
                class="menu-button"
                onclick="toggleSidebar()"
            >
                ☰
            </button>

            <div class="header-title">
                Nova AI
            </div>

        </header>



        <!-- Messages -->

        <div id="chat-box">

            <div class="welcome">

                <div class="nova-logo">
                    🤖
                </div>

                <h1>
                    Hi, I'm Nova
                </h1>

                <p>
                    Your personal AI assistant
                </p>


                <div class="suggestions">

                    <button
                        onclick="suggest('Help me with homework')"
                    >
                        📚 Homework
                    </button>

                    <button
                        onclick="suggest('Help me code')"
                    >
                        💻 Coding
                    </button>

                    <button
                        onclick="suggest('Give me ideas')"
                    >
                        💡 Ideas
                    </button>

                    <button
                        onclick="suggest('Ask me a question')"
                    >
                        ❓ Questions
                    </button>

                </div>

            </div>

        </div>



        <!-- Input -->

        <div class="input-area">

            <input

                id="user-input"

                type="text"

                autocomplete="off"

                placeholder="Message Nova..."

            >

            <button

                class="send-button"

                onclick="sendMessage()"

            >

                ➜

            </button>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>

</html>
